# Cấu hình broker. Được mount vào /etc/rabbitmq/conf.d/20-realestate.conf
# (xem infra/compose/docker-compose.yml).
#
# KHÔNG dùng load_definitions: khi có load_definitions, RabbitMQ bỏ qua việc tạo user/vhost mặc định
# từ RABBITMQ_DEFAULT_USER/PASS và crash-loop trên volume trống. Thay vào đó, container
# rabbitmq-init (chạy một lần) POST infra/rabbitmq/definitions.json vào Management API bằng
# tài khoản lấy từ .env, nên .env là nguồn duy nhất và definitions.json không chứa bí mật.

# Log ra console (xem bằng `pnpm infra:logs`).
log.console = true
log.console.level = info
