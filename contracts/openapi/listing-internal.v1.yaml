openapi: 3.1.0
info:
  title: listing-service, API nội bộ
  version: 1.0.0
  description: |
    API chỉ dành cho service khác gọi (không qua api-gateway, không có prefix /api/v1).
    Người phụ trách: B (listing). Người gọi: rental (lúc người thuê gửi yêu cầu giữ chỗ).

    Rental dùng kết quả để quyết định có tạo reservation hay không, rồi lưu snapshot
    `depositAmount`, `landlordId`, `title`. Rental **không** dựa vào `isAvailable` của listing
    (xem docs/architecture/service-boundaries.md, mục 2), nên response không có trường đó.
servers:
  - url: http://localhost:3002
    description: listing chạy trên laptop
  - url: http://listing:3002
    description: listing chạy trong Docker
paths:
  /internal/listings/{id}:
    get:
      operationId: getListingInternal
      summary: Lấy thông tin tin đăng để tạo reservation
      parameters:
        - $ref: '#/components/parameters/ListingId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Tìm thấy tin đăng (kể cả khi đã ẩn; người gọi tự kiểm tra `isPublished`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingInternal'
              example:
                id: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
                landlordId: b2c3d4e5-f6a7-4b8c-9d0e-1f2a3b4c5d6e
                landlordName: Trần Thị Bình
                title: Phòng 25m2 gần ĐH Bách Khoa
                depositAmount: 3000000
                isPublished: true
        '400':
          description: '`id` không phải UUID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: VALIDATION_FAILED
                message: id phải là UUID
                correlationId: 5e0c7f3a-2b1d-4c9e-8f6a-1b2c3d4e5f60
        '404':
          description: Không có tin đăng này (hoặc đã bị xóa hẳn)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: LISTING_NOT_FOUND
                message: Không tìm thấy tin đăng
                correlationId: 5e0c7f3a-2b1d-4c9e-8f6a-1b2c3d4e5f60
components:
  parameters:
    ListingId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: InternalHttpService của template tự chuyển tiếp từ request gốc
      schema:
        type: string
        pattern: '^[\w.:-]{1,128}$'
  schemas:
    ListingInternal:
      type: object
      additionalProperties: false
      required: [id, landlordId, landlordName, title, depositAmount, isPublished]
      properties:
        id:
          type: string
          format: uuid
        landlordId:
          type: string
          format: uuid
          description: Chủ nhà (identity). Rental lưu snapshot.
        landlordName:
          type: string
          minLength: 1
          maxLength: 200
          description: Snapshot tên chủ nhà mà listing đang giữ
        title:
          type: string
          minLength: 1
          maxLength: 200
        depositAmount:
          type: integer
          minimum: 1
          description: Số tiền cọc (VND, số nguyên). Rental lưu snapshot, payment thu đúng số này.
        isPublished:
          type: boolean
          description: |
            true khi tin đang hiển thị và chủ nhà còn nhận yêu cầu. false thì rental trả
            409 RENTAL_LISTING_NOT_AVAILABLE cho người thuê.
    ErrorResponse:
      type: object
      required: [code, message, correlationId]
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
          description: Mã lỗi ổn định, người gọi dựa vào đây để xử lý
        message:
          type: string
        details:
          description: Dữ liệu bổ sung (lỗi từng trường...)
        correlationId:
          type: string
