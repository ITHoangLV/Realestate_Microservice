openapi: 3.1.0
info:
  title: rental-service, API nội bộ
  version: 2.0.0
  description: |
    API chỉ dành cho service khác gọi (không qua api-gateway, không có prefix /api/v1).
    Response theo khung chung của template: thành công `{ data, meta }`, lỗi `{ error, meta }`.
    Người phụ trách: C (rental). Người gọi: payment (S4, trước khi tạo lệnh rút).
    Thiết kế: `project-knowledge/design/RENTAL/RE.DEPOSIT_LIFECYCLE/API_Spec.md §2`.

    Thay `GET /internal/reservations/{id}` của luồng reservation cũ (chưa service nào gọi,
    xóa theo quyết định A7, B8 ngày 2026-11-12).

    Điều kiện rút (BR-15, sửa 2026-11-12):
    - `RELEASED`: đủ được khi có cả mốc bàn giao và mốc chủ trọ xác nhận.
    - `REFUNDED` (người thuê tự hủy): luôn đủ, không cần hai mốc; chủ trọ rút phần còn lại sau hoàn 70%.
    - Trạng thái khác: không đủ, `missing = [NOT_RELEASED]`.
    Payment tự tính số tiền rút và tự kiểm "không có lệnh rút hay hoàn đang mở" (RE.PAYOUT §1.1).
servers:
  - url: http://localhost:3003
    description: rental chạy trên laptop
  - url: http://rental:3003
    description: rental chạy trong Docker
paths:
  /internal/deposits/{id}/withdrawal-eligibility:
    get:
      operationId: getWithdrawalEligibility
      summary: Kiểm tra đơn đặt cọc đã đủ điều kiện rút tiền chưa
      description: Chỉ đọc, payment được retry.
      parameters:
        - $ref: '#/components/parameters/DepositId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Có đơn. `eligible = false` vẫn trả 200, kèm `missing`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawalEligibilityResponse'
              example:
                data:
                  depositId: 3f9a1c2e-8b4d-4e6f-a1b2-c3d4e5f60718
                  ownerId: b2c3d4e5-f6a7-4b8c-9d0e-1f2a3b4c5d6e
                  amountVnd: 3000000
                  status: PAID
                  eligible: false
                  missing: [NOT_RELEASED]
                meta:
                  correlationId: 5e0c7f3a-2b1d-4c9e-8f6a-1b2c3d4e5f60
                  timestamp: '2026-11-21T09:00:00Z'
        '400':
          description: '`id` không phải UUID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: VALIDATION_FAILED
                  message: id phải là UUID
                meta:
                  correlationId: 5e0c7f3a-2b1d-4c9e-8f6a-1b2c3d4e5f60
                  timestamp: '2026-11-21T09:00:00Z'
        '404':
          description: Không có đơn đặt cọc này
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: RENTAL_DEPOSIT_NOT_FOUND
                  message: Không tìm thấy đơn đặt cọc
                meta:
                  correlationId: 5e0c7f3a-2b1d-4c9e-8f6a-1b2c3d4e5f60
                  timestamp: '2026-11-21T09:00:00Z'
components:
  parameters:
    DepositId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: InternalHttpService của template tự chuyển tiếp từ request gốc
      schema:
        type: string
        pattern: '^[\w.:-]{1,128}$'
  schemas:
    WithdrawalEligibility:
      type: object
      additionalProperties: false
      required: [depositId, ownerId, amountVnd, status, eligible, missing]
      properties:
        depositId:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
          description: Chủ trọ của đơn (bản chụp). Payment so với `sub` của người tạo lệnh rút.
        amountVnd:
          type: integer
          minimum: 1
          description: Tiền cọc của đơn (bản chụp, VND). Không phải số tiền được rút.
        status:
          enum:
            [
              PENDING_PAYMENT,
              PAID,
              EXPIRED,
              CANCELLED,
              REFUND_REQUESTED,
              REFUNDED,
              RELEASED,
              WITHDRAWN,
            ]
          description: Trạng thái đơn (RE.BUSINESS_RULES §5)
        eligible:
          type: boolean
        missing:
          type: array
          uniqueItems: true
          items:
            enum: [NOT_RELEASED, NOT_HANDED_OVER, NOT_ACKNOWLEDGED]
          description: Điều kiện còn thiếu; rỗng khi `eligible = true`
    WithdrawalEligibilityResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/WithdrawalEligibility'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ResponseMeta:
      type: object
      required: [correlationId, timestamp]
      properties:
        correlationId:
          type: string
          description: Trùng header X-Request-ID, dùng để truy vết một request qua nhiều service
        timestamp:
          type: string
          format: date-time
          description: Thời điểm server tạo response (ISO 8601 UTC)
    ErrorResponse:
      type: object
      required: [error, meta]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              pattern: '^[A-Z][A-Z0-9_]*$'
              description: Mã lỗi ổn định, người gọi dựa vào đây để xử lý
            message:
              type: string
            details:
              description: Dữ liệu bổ sung
        meta:
          $ref: '#/components/schemas/ResponseMeta'
